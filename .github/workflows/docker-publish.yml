name: Canonical OCI release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      packages: write
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract OCI metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/nodalora-portfolio
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=Nodalora Portfolio
            org.opencontainers.image.description=Local-first portfolio client forked from Wealthfolio
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=AGPL-3.0-only

      - name: Build and publish the multi-architecture image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Record the OCI digest and checksum
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          test -n "$IMAGE_DIGEST"
          printf '%s\n' "$IMAGE_DIGEST" > image-digest.txt
          sha256sum image-digest.txt > image-digest.txt.sha256

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign the immutable OCI digest
        env:
          COSIGN_EXPERIMENTAL: "1"
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          cosign sign --yes "ghcr.io/${{ github.repository_owner }}/nodalora-portfolio@${IMAGE_DIGEST}"

      - name: Publish digest evidence
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            image-digest.txt
            image-digest.txt.sha256

  addon:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the SDK declarations
        run: pnpm --filter @wealthfolio/addon-sdk build

      - name: Configure the declared Nodalora API host
        env:
          NODALORA_API_HOST: ${{ vars.NODALORA_API_HOST }}
        run: node packages/nodalora-addon/scripts/configure-api-host.mjs

      - name: Type-check and bundle the Nodalora addon
        run:
          pnpm --filter @cl4yn4/nodalora-portfolio-addon type-check && pnpm --filter
          @cl4yn4/nodalora-portfolio-addon bundle

      - name: Create addon checksum
        run:
          sha256sum packages/nodalora-addon/dist/nodalora-portfolio-addon-*.zip >
          packages/nodalora-addon/dist/nodalora-portfolio-addon.sha256

      - name: Publish addon evidence
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            packages/nodalora-addon/dist/nodalora-portfolio-addon-*.zip
            packages/nodalora-addon/dist/nodalora-portfolio-addon.sha256
